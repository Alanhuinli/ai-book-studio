  <text x="60" y="270" fill="#475569" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12.5">觸發演算法二次免費推流。</text>
  <rect x="60" y="302" width="162" height="28" rx="8" fill="#dbeafe"/>
