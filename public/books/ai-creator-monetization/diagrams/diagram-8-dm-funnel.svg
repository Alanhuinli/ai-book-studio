  <text x="40" y="116" fill="#475569" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14">留言數越多推流越猛，同時自動把公域路人變成你的私域精準買家名單！</text>

  <!-- Node 1 -->
  <rect x="40" y="154" width="202" height="196" rx="16" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
