<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="960" height="440" rx="24" fill="url(#bg1)"/>

  <!-- Header -->
  <rect x="40" y="32" width="136" height="28" rx="14" fill="#4f46e5"/>
  <text x="108" y="51" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700">圖解 01 · 時間槓桿</text>
  <text x="40" y="96" fill="#ffffff" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="800">上班族「每週 5 小時」AI 自媒體高產能作戰藍圖</text>
  <text x="40" y="124" fill="#94a3b8" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="14">拒絕日更過勞！用「批次生產 × AI 協作」一次搞定整週 7 篇爆文 ＋ 3 支短影音</text>

  <!-- Step 1 -->
  <rect x="40" y="156" width="205" height="236" rx="18" fill="url(#cardBlue)" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="74" cy="192" r="18" fill="#6366f1"/>
  <text x="74" y="198" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">01</text>
  <text x="102" y="198" fill="#c7d2fe" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" font-weight="700">週一晚上｜30 分鐘</text>
  <text x="58" y="236" fill="#ffffff" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="800">AI 痛點雷達選題</text>
  <text x="58" y="268" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 擷取同領域熱門討論</text>
  <text x="58" y="294" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• AI 延伸 10 個反常識切角</text>
  <text x="58" y="320" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 鎖定本週 3 大核心母題</text>
  <rect x="58" y="346" width="168" height="28" rx="8" fill="#1e293b"/>
  <text x="142" y="365" text-anchor="middle" fill="#818cf8" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700">產出：1 週選題彈藥庫</text>

  <!-- Arrow 1 -->
  <path d="M251 274 L265 274" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 2 -->
  <rect x="270" y="156" width="205" height="236" rx="18" fill="url(#cardBlue)" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="304" cy="192" r="18" fill="#6366f1"/>
  <text x="304" y="198" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">02</text>
  <text x="332" y="198" fill="#c7d2fe" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" font-weight="700">週二晚上｜90 分鐘</text>
  <text x="288" y="236" fill="#ffffff" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="800">一魚多吃文稿裂變</text>
  <text x="288" y="268" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 口述 5 分鐘真實觀點</text>
  <text x="288" y="294" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• AI 轉寫 7 篇 Threads 串文</text>
  <text x="288" y="320" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 同步拆出 3 支口播逐字稿</text>
  <rect x="288" y="346" width="168" height="28" rx="8" fill="#1e293b"/>
  <text x="372" y="365" text-anchor="middle" fill="#818cf8" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700">產出：7 篇圖文＋3 腳本</text>

  <!-- Arrow 2 -->
  <path d="M481 274 L495 274" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 3 -->
  <rect x="500" y="156" width="205" height="236" rx="18" fill="url(#cardBlue)" stroke="#4f46e5" stroke-width="1.5"/>
  <circle cx="534" cy="192" r="18" fill="#6366f1"/>
  <text x="534" y="198" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">03</text>
  <text x="562" y="198" fill="#c7d2fe" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" font-weight="700">週四晚上｜120 分鐘</text>
  <text x="518" y="236" fill="#ffffff" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="800">AI 短影音快速合成</text>
  <text x="518" y="268" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• AI 生成吸睛 B-Roll 素材</text>
  <text x="518" y="294" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 自動語音對嘴與動態字幕</text>
  <text x="518" y="320" fill="#cbd5e1" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 一鍵發佈 Reels / Shorts</text>
  <rect x="518" y="346" width="168" height="28" rx="8" fill="#1e293b"/>
  <text x="602" y="365" text-anchor="middle" fill="#818cf8" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700">產出：3 支高完播短影音</text>

  <!-- Arrow 3 -->
  <path d="M711 274 L725 274" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 4 -->
  <rect x="730" y="156" width="190" height="236" rx="18" fill="url(#cardGold)" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="764" cy="192" r="18" fill="#ffffff"/>
  <text x="764" y="198" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="14" font-weight="800">04</text>
  <text x="790" y="198" fill="#fef3c7" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13" font-weight="700">週末｜60 分鐘</text>
  <text x="748" y="236" fill="#ffffff" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="800">自動漏斗收單變現</text>
  <text x="748" y="268" fill="#fef3c7" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 留言關鍵字自動私訊</text>
  <text x="748" y="294" fill="#fef3c7" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 派發免費乾貨名單磁鐵</text>
  <text x="748" y="320" fill="#fef3c7" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">• 導流至數位書坊成交</text>
  <rect x="748" y="346" width="154" height="28" rx="8" fill="#78350f"/>
  <text x="825" y="365" text-anchor="middle" fill="#fde68a" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" font-weight="700">成果：24H 被動成交</text>
</svg>
